packages:
  - example/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  better-sqlite3@12.11.1: true
  better-sqlite3@13.0.3: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true

catalog:
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.943ee4a9e322a7ad4b1b4113f844cd541a10b159
  vite-plus: 0.0.0-commit.943ee4a9e322a7ad4b1b4113f844cd541a10b159
  vitest: 5.1.0
  '@vitest/coverage-v8': 5.1.0

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - '@tailwindcss/oxide'
  - better-sqlite3
  - esbuild
  - msgpackr-extract
  - prisma
  - sharp
  - unrs-resolver
  - workerd

overrides:
  '@cloudflare/workers-types': 5.20261027.1
  better-auth: 1.7.14
  drizzle-orm: 0.45.4
  kysely: 0.28.17
  pg: 8.23.1
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

